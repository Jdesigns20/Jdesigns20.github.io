<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Bulletin Board (Exercise)</title>
        <link href="css/setup.css" rel="stylesheet">
        <link href="css/style.css" rel="stylesheet" data-meal-prep>
    </head>
    <body>
        <div id="bulletin-board">
            <!-- ADD YOUR HTML CODE INSIDE OF THIS DIV -->
            <div class="post-it blue">
             <h2>Leeb, Leefuh, Lurve</h2>
             <p>- Sims 4 Loading Screen</p>
            </div>
            <div class="post-it red">
             <h2>Check on oven in 30 MIN</h2>
             <p>- Is cassorole supposed to smell burnt?</p>
            </div>
              <div class="post-it yellow">
             <h2>Plans for Tommorrow</h2>
            <p>
                <ul>
                  <li>Zumba class: 10am</li>
                  <li>Find Atlantis: 1pm</li>
                  <li>World domination: 5pm</li>
                </ul>
                <p>(I can't miss that again)</p>
            </p>
            </div>
            <div class="post-it polaroid">
                <p>Just. Keep. Flowing</p>
              <img 
               class="p-img"
               src="images/W.fall.jpg"
               alt="Waterfall"
               >
            </div>
             <div class="post-it purple">
             <h2> <i> Mind</i></h2>
             <hr>
             <h2> Matter</h2> 
            </div>
             <div class="post-it green">
             <h2>Don't forget the milk again!<h2>
            </div>
    </body>
</html>
