<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Playlists</title>
         <link 
            rel="stylesheet" 
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css" 
            integrity="sha512-xh6O/CkQoPOWDdYTDqeRdPCVd1SpvCA9XXcUnZS2FmJNp1coAFzvtCN9BmamE+4aHK8yyUHUSCcJHgXloTyT2A==" 
            crossorigin="anonymous" 
            referrerpolicy="no-referrer" />
    </head>
    <body>
        <h1>Liked Songs</h1>
        <hr>
        <h3>Now playing</h3>
        <img 
          src="images/Dopa.jpg"
          width="300"
          alt="Cover art for the song currently playing"
          >
        <p> <b>DOPAMINE</b> <i> by YX</i></p>
        <hr>
           <h5>Next in the Queue</h5>
        <img 
          src="images/wfm.jpg"
          width="100"
          alt="Cover art for the next song in the queue"
          >
        <p>WFM <i> by RealestK</i></p>
         <img 
          src="images/Oaklnd.jpg"
          width="100"
          alt="Cover art for the next song in the queue"
          >
        <p>Oakland Pt.2 <i> by Karri</i></p>
         <img 
          src="images/Lve.Urz.jpg"
          width="100"
          alt="Cover art for the next song in the queue"
          >
        <p>Love Yourz <i> by J.Cole</i></p>
    </body>
</html>
