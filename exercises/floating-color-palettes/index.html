          <h2>Smokey Noir</h2>

        <div class="color-palette">
          <h2>Scarlet Macaw</h2>
          <h4 id="p3-c1" class="color">#FE4A49</h4>
          <h4 id="p3-c2" class="color">#FED766</h4>
